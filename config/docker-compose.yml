# 企業 AI 平台 — Docker Compose（Phase 0 原始範本）
# ⚠️ 此檔案為初始設計範本，僅供參考
# ⚠️ 實際部署請使用各 phase 目錄下的 docker-compose.yml：
#   - phase-1/n8n/docker-compose.yml（n8n，bind mount）
#   - phase-1/mattermost/docker-compose.yml（Mattermost + PostgreSQL，bind mount）
#   - phase-1/dify/dify/docker/docker-compose.yaml（Dify，官方 compose）
#
# 原始設計包含 Slack（已改用 Mattermost）和 Redis（Phase 1 未使用）

services:
  # ============================================
  # n8n — 自動化協調層
  # http://localhost:5678
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:?Set N8N_PASSWORD in .env}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Taipei
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai-platform
    depends_on:
      - redis

  # ============================================
  # Redis — 快取 + 額度計數
  # ============================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - ai-platform

  # ============================================
  # PostgreSQL — Dify + 審計日誌
  # ============================================
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: dify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-platform

volumes:
  n8n_data:
  redis_data:
  postgres_data:

networks:
  ai-platform:
    driver: bridge
